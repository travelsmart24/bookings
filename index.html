/* ---------- 0. ACCESS GATE (front-door lock for opening this file) ----------

function sha256(ascii){function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),i,j,result='',words=[],bl=ascii.length*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};

 <div class="card" style="background:var(--gl)"><b>Customize</b><div class="row" style="margin-top:8px">${inp('pk_pax','Travellers',2,'number','oninput="pkgUpd(\''+id+'\')"')}${sel('pk_tier','Hotel option',p.hotels,'Deluxe 4★').replace('<select','<select onchange="pkgUpd(\''+id+'\')"')}${sel('pk_veh','Vehicle option',VEHICLES.slice(4).map(v=>[v.id,v.name]))}${inp('pk_date','Travel date',iso(addDays(14)),'date')}</div><div id="pk_p" style="margin-top:10px"></div></div>
 <p class="sub"><b>Cancellation:</b> ${esc(db.settings.cancelRule)}<br><b>T&C:</b> Rates subject to availability; peak-season surcharges may apply.</p><button class="btn" onclick="pkgBook('${id}')">Book Now</button> <button class="btn o" onclick="pkgQuote('${id}',1)">Get Quote</button> <button class="btn d" onclick="closeModal()">Close</button>`,1);pkgUpd(id)}

function pkgBook(id){const c=pkgCalc(id);CART.pkg=({type:'package',id,title:`${c.p.name} · ${c.pax} pax · ${c.tier}`,dest:c.p.dest,net:c.net,travel:val('pk_date'),days:c.p.days,meta:[]});openBook('pkg')}

 <label>Customer</label><select id="bk_cust"><option value="">— select customer —</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.mobile}</option>`).join('')}</select><div style="margin:6px 0"><a href="#" onclick="quickCust();return false">+ Add new customer</a></div>

 if(u.wallet-it.net<-u.credit)return toast('Insufficient wallet & credit. Add money first.','er');const p=calcPrice(it.net,mk,val('bk_promo')),id=bid();
 const st=it.onReq?'On Request':db.settings.autoConfirm?'Confirmed':'Pending';
 db.bookings.push({id,agentId:u.id,custId:c,type:it.type,title:it.title,dest:it.dest,travel:val('bk_date'),net:it.net,sell:p.sell,markup:p.margin,disc:p.disc,final:p.final,status:st,pay:'Paid',supRef:'SUP'+Math.floor(10000+Math.random()*89999),conf:st=='Confirmed'?(it.type=='flight'?'PNR':'CNF')+Math.floor(100000+Math.random()*899999):'',created:today()});
 u.wallet-=it.net;db.txns.push({id:tid(),agentId:u.id,date:today(),type:'Debit',amt:it.net,desc:'Booking '+id,mode:'Wallet'});audit('Booking '+id);save();toast('Booking '+id+' '+st);closeModal();viewB(id)}

V.bookings=()=>{const q=(S.p.q||'').toLowerCase(),st=S.p.st||'All',B=myB().filter(b=>(st=='All'||b.status==st)&&(!q||(b.id+b.title+custOf(b.custId).name+agName(b.agentId)).toLowerCase().includes(q))).sort((a,b)=>a.id<b.id?1:-1);

function viewB(id){const b=db.bookings.find(x=>x.id==id),c=custOf(b.custId),steps=['Created','Paid','Confirmed','Completed'],done=b.status=='Completed'?4:['Confirmed'].includes(b.status)?3:b.pay=='Paid'?2:1,adm=isAdm();

 <button class="btn s" onclick="voucher('${b.id}')">⬇ Voucher</button> <button class="btn s" onclick="invoice('${b.id}')">⬇ Invoice</button> <button class="btn s o" onclick="window.open(waLink('${c.mobile}',waText('${b.id}')))">📲 WhatsApp</button> <button class="btn s o" onclick="location.href='mailto:${c.email}?subject=Booking ${b.id}&body='+encodeURIComponent(waText('${b.id}'))">✉ Email</button>
 ${['Cancelled','Failed','Refunded','Completed'].includes(b.status)?'':`<button class="btn s r" onclick="cancelB('${b.id}')">Cancel</button> <button class="btn s o" onclick="amendB('${b.id}')">Amend</button>`}${adm&&(b.refundPending||b.status=='Cancelled')?` <button class="btn s d" onclick="refundB('${b.id}')">Refund to wallet</button>`:''}
 ${adm?`<br><br><label>Update status (admin)</label><select onchange="setStatus('${b.id}',this.value)">${['Pending','Confirmed','On Request','Cancelled','Completed','Failed','Refunded','Amendment Requested'].map(s=>`<option ${s==b.status?'selected':''}>${s}</option>`).join('')}</select>`:''} ${isSuper()?`<button class="btn s r" onclick="delRec('booking','${b.id}')">🗑 Delete</button> `:''}<button class="btn s d" onclick="closeModal()">Close</button>`,1)}
const waText=id=>{const b=db.bookings.find(x=>x.id==id);return `Hello ${custOf(b.custId).name}, your booking ${b.id} (${b.title}) on ${b.travel} is ${b.status}. Amount ${fmt(b.final)}. Conf no: ${b.conf||'pending'}. — Travelsmart24 Travel Tourism`};

 printDoc('Tax Invoice',`<p><b>Invoice:</b> INV-${b.id.slice(-4)} &nbsp; <b>Booking:</b> ${b.id}<br><b>Agent:</b> ${esc(a.company)} (GST ${esc(a.gst||'-')})<br><b>Customer:</b> ${esc(c.name)} · ${esc(c.mobile)}</p><table><tr><th>Service</th><th class="r">Amount</th></tr><tr><td>${esc(b.title)}<br>Travel ${b.travel}</td><td class="r">${fmt(b.net)}</td></tr><tr><td>Agent service markup</td><td class="r">${fmt(b.markup)}</td></tr><tr><td>Discount</td><td class="r">− ${fmt(b.disc)}</td></tr><tr><td>Taxable value</td><td class="r">${fmt(base)}</td></tr><tr><td>GST @ ${g}% (included)</td><td class="r">${fmt(b.final-base)}</td></tr><tr class="tot"><td>Total</td><td class="r">${fmt(b.final)}</td></tr></table><p>Payment status: <b>${b.pay}</b></p>`)}

let Q={cust:'',dest:'',items:[],mk:10,tax:5,phone:''};
const qTot=(it,mk,tax)=>{const base=it.reduce((s,x)=>s+(+x.c||0),0),m=base*mk/100,t=(base+m)*tax/100;return{base,m,t,tot:base+m+t}};
V.quotes=()=>{const t=qTot(Q.items,Q.mk,Q.tax),cat=[...HOTELS.map(h=>['H'+h.id,h.name+' (1 night)',netRate('hotel',h.city,me().id,h.sup),'hotel']),...PACKAGES.map(p=>['P'+p.id,p.name+' (per pax)',netRate('package',p.dest,me().id,p.sup),'pkg']),...VEHICLES.map(v=>['V'+v.id,v.name+' (per day)',netRate('vehicle','',me().id,v.sup),'veh'])];
 return `<h1>Quotation Builder</h1><div class="sub">Base cost + markup + taxes = final quotation</div><div class="grid g2"><div class="card"><h3>Build</h3><div class="row">${inp('qc','Customer name',esc(Q.cust),'text','oninput="Q.cust=this.value"')}${inp('qp','Customer mobile',Q.phone,'text','oninput="Q.phone=this.value"')}${inp('qd','Destination',esc(Q.dest||''),'text','oninput="Q.dest=this.value"')}</div><br><label>Add from catalog (hotel / package / vehicle / transfer / meals…)</label><select id="qcat" onchange="qAdd(this.value)"><option value="">— select —</option>${cat.map(c=>`<option value="${c[0]}">${esc(c[1])} — ${fmt(c[2])}</option>`).join('')}</select><br><br>
 ${table(['Item','Cost (₹)',''],Q.items.map((x,i)=>[`<input value="${esc(x.d)}" onchange="Q.items[${i}].d=this.value">`,`<input type="number" style="width:110px" value="${x.c}" onchange="Q.items[${i}].c=+this.value;render()">`,`<button class="btn s r" onclick="Q.items.splice(${i},1);render()">✕</button>`]))}<button class="btn s o" onclick="Q.items.push({d:'Transfers / meals / activities',c:1000});render()">+ Custom line</button><div class="row" style="margin-top:12px">${inp('qm','Markup %',Q.mk,'number','onchange="Q.mk=+this.value;render()"')}${inp('qt','Tax (GST) %',Q.tax,'number','onchange="Q.tax=+this.value;render()"')}</div><div class="card" style="background:var(--gl);margin-top:10px">Base ${fmt(t.base)} + Markup ${fmt(t.m)} + Tax ${fmt(t.t)}<br><b style="font-size:20px">Final quotation: ${fmt(t.tot)}</b></div><br><button class="btn" onclick="qSave()">Save Quotation</button></div>
 <div class="card"><h3>Saved quotations</h3>${table(['ID','Customer','Total',''],db.quotes.filter(q=>myIds().includes(q.agentId)).map(q=>{const x=qTot(q.items,q.mk,q.tax);return [q.id,esc(q.cust),fmt(x.tot),`<button class="btn s" onclick="qPrint('${q.id}')">PDF / Print</button> <button class="btn s o" onclick="qWa('${q.id}')">WhatsApp</button> <button class="btn s o" onclick="qMail('${q.id}')">Email</button>${isSuper()?` <button class="btn s r" onclick="delRec('quote','${q.id}')">Delete</button>`:''}`]}))}</div></div>`};
function qAdd(k){if(!k)return;const id=k.slice(1);let d,c;if(k[0]=='H'){const h=HOTELS.find(x=>x.id==id);d=h.name+' (1 night)';c=netRate('hotel',h.city,me().id,h.sup)}else if(k[0]=='P'){const p=PACKAGES.find(x=>x.id==id);d=p.name+' (per pax)';c=netRate('package',p.dest,me().id,p.sup)}else{const v=VEHICLES.find(x=>x.id==id);d=v.name+' (per day)';c=netRate('vehicle','',me().id,v.sup)}Q.items.push({d,c});render()}
function qSave(){if(!Q.items.length)return toast('Add items first','er');const q={id:'Q-'+nextN(db.quotes,/^Q-(\d+)$/,2001),agentId:me().id,cust:Q.cust||'Customer',dest:Q.dest,items:JSON.parse(JSON.stringify(Q.items)),mk:Q.mk,tax:Q.tax,date:today(),phone:Q.phone};db.quotes.push(q);save();toast('Saved '+q.id);render()}
const qTxt=q=>{const t=qTot(q.items,q.mk,q.tax);return `Quotation ${q.id} for ${q.cust}${q.dest?' — '+q.dest:''}\n${q.items.map(x=>'• '+x.d).join('\n')}\nTotal (incl. taxes): ${fmt(t.tot)}\n— Travelsmart24 Travel Tourism`};
function qPrint(id){const q=db.quotes.find(x=>x.id==id),t=qTot(q.items,q.mk,q.tax);printDoc('Quotation '+q.id,`<p><b>Customer:</b> ${esc(q.cust)} · <b>Destination:</b> ${esc(q.dest||'-')} · <b>Date:</b> ${q.date}</p><table><tr><th>Service</th></tr>${q.items.map(x=>`<tr><td>${esc(x.d)}</td></tr>`).join('')}</table><table><tr><td>Package cost (incl. service fee)</td><td class="r">${fmt(t.base+t.m)}</td></tr><tr><td>GST @ ${q.tax}%</td><td class="r">${fmt(t.t)}</td></tr><tr class="tot"><td>Total quotation</td><td class="r">${fmt(t.tot)}</td></tr></table><p>Valid for 7 days. ${esc(db.settings.cancelRule)}</p>`)}
const qWa=id=>{const q=db.quotes.find(x=>x.id==id);window.open(waLink(q.phone,qTxt(q)))},qMail=id=>{const q=db.quotes.find(x=>x.id==id);location.href='mailto:?subject='+encodeURIComponent('Quotation '+q.id)+'&body='+encodeURIComponent(qTxt(q))};

/* markup engine (super admin) */
V.markup=()=>{const R=db.rules,ex=10000,t=today(),demo=netRate('hotel','Coorg','A001',ex);return `<h1>Markup Engine</h1><div class="sub">Priority: Agent › Group › Destination › Product › Default (+ seasonal on top). Supplier prices never reach agents.</div><div class="card"><h3>Example</h3>Supplier ₹10,000 → B2B net for A001 / hotel / Coorg: <b>${fmt(demo)}</b> → agent 10% markup → <b>${fmt(demo*1.1)}</b> customer price</div><br>
 <div class="card"><h3>Rules</h3>${table(['Scope','Key','Type','Value','Dates','Active',''],R.map(r=>[r.scope,esc(r.key),r.type=='pct'?'Percentage':'Fixed',r.type=='pct'?r.value+'%':fmt(r.value),r.from?r.from+' → '+r.to:'—',`<input type="checkbox" style="width:auto" ${r.active?'checked':''} onchange="ruleTog('${r.id}',this.checked)">`,`<button class="btn s r" onclick="ruleDel('${r.id}')">✕</button>`]))}
 <h3 style="margin-top:16px">Add rule</h3><div class="row">${sel('r_s','Scope',['default','product','destination','agent','group','season'])}${inp('r_k','Key (hotel / Goa / A003 / group name / season name)')}${sel('r_t','Type',[['pct','Percentage'],['fixed','Fixed ₹']])}${inp('r_v','Value',5,'number')}${inp('r_f','Season from','','date')}${inp('r_to','Season to','','date')}<button class="btn" onclick="ruleAdd()">Add</button></div><p class="sub">Also in Settings: minimum agent markup (${db.settings.minMk}%) enforced at booking. Commission = agent margin (selling − net).</p></div>`};
const ruleTog=(id,v)=>{db.rules.find(r=>r.id==id).active=v;save()},ruleDel=id=>{db.rules=db.rules.filter(r=>r.id!=id);save();render()};
function ruleAdd(){db.rules.push({id:'R'+Date.now(),scope:val('r_s'),key:val('r_k')||'*',type:val('r_t'),value:+val('r_v'),from:val('r_f'),to:val('r_to'),active:true});audit('Rule added');save();toast('Rule added');render()}

/* offers */
V.offers=()=>`<h1>Offers & Promotions</h1><div class="sub">${isAdm()?'Create offers; agents apply promo codes at booking.':'Use the promo code in the booking window.'}</div><div class="grid g3">${db.offers.map(o=>`<div class="card kpi"><b>${esc(o.name)}</b><div class="v">${o.type=='pct'?o.value+'% OFF':fmt(o.value)+' OFF'}</div>Code: <span class="tag">${o.code}</span><br>${o.from} → ${o.to}<br>Max ${fmt(o.max)} · ${esc(o.dest)} · ${esc(o.agents)}<br>${badge(o.active?'Active':'Suspended')} ${isAdm()?`<button class="btn s o" onclick="offTog('${o.id}')">Toggle</button>${isSuper()?` <button class="btn s r" onclick="delRec('offer','${o.id}')">Delete</button>`:''}`:''}</div>`).join('')}</div>${isAdm()?`<br><div class="card"><h3>New offer</h3><div class="row">${inp('o_n','Name')}${inp('o_c','Promo code')}${sel('o_t','Type',[['pct','Percentage'],['fixed','Fixed ₹']])}${inp('o_v','Value',10,'number')}${inp('o_m','Max discount',2000,'number')}${inp('o_f','Start',today(),'date')}${inp('o_e','End',iso(addDays(30)),'date')}${inp('o_d','Eligible destinations','All')}${inp('o_a','Eligible agents','All')}<button class="btn" onclick="offAdd()">Create</button></div></div>`:''}`;
const offTog=id=>{const o=db.offers.find(x=>x.id==id);o.active=!o.active;save();render()};
function offAdd(){if(!val('o_n')||!val('o_c'))return toast('Name & code required','er');db.offers.push({id:'O'+Date.now(),name:val('o_n'),code:val('o_c').toUpperCase(),type:val('o_t'),value:+val('o_v'),max:+val('o_m'),from:val('o_f'),to:val('o_e'),dest:val('o_d'),agents:val('o_a'),active:true});save();toast('Offer created');render()}

/* reports */
const REPS={sales:'Sales',booking:'Booking',agent:'Agent',subagent:'Sub-Agent',commission:'Commission',markup:'Markup',wallet:'Wallet',payment:'Payment',cancellation:'Cancellation',product:'Product',destination:'Destination',gst:'GST'};
function repData(){const k=S.p.r||'sales',f=S.p.f||'',t=S.p.t||'9999',ag=S.p.ag||'',pr=S.p.pr||'',B=myB().filter(b=>b.created>=f&&b.created<=t&&(!ag||b.agentId==ag)&&(!pr||b.type==pr)),L=B.filter(live),g=db.settings.gst;
 const bk=b=>[b.id,b.created,agName(b.agentId),custOf(b.custId).name,b.type,b.dest,b.status,b.net,b.final];const BC=['ID','Date','Agent','Customer','Product','Destination','Status','Net','Selling'];
 const grp=(kf)=>({c:['Group','Bookings','Net','Sales','Margin'],r:Object.entries(L.reduce((m,b)=>{const x=kf(b);(m[x]=m[x]||[0,0,0,0]);m[x][0]++;m[x][1]+=b.net;m[x][2]+=b.final;m[x][3]+=b.markup;return m},{})).map(([a,v])=>[a,v[0],...v.slice(1)])});
 switch(k){case 'booking':return{c:BC,r:B.map(bk)};case 'sales':return{c:BC,r:L.map(bk)};case 'agent':return grp(b=>agName(b.agentId));case 'subagent':{const r=grp(b=>agName(b.agentId));r.r=r.r.filter(x=>db.agents.find(a=>a.company==x[0]&&a.role=='sub'));return r}case 'product':return grp(b=>b.type);case 'destination':return grp(b=>b.dest);
 case 'commission':case 'markup':return{c:['ID','Agent','Product','Net','Markup','Selling'],r:L.map(b=>[b.id,agName(b.agentId),b.type,b.net,b.markup,b.final])};case 'wallet':return{c:['Date','Txn','Agent','Type','Description','Amount'],r:myT().filter(x=>x.date>=f&&x.date<=t&&(!ag||x.agentId==ag)).map(x=>[x.date,x.id,agName(x.agentId),x.type,x.desc,x.amt])};
 case 'payment':return{c:['ID','Agent','Payment','Amount'],r:B.map(b=>[b.id,agName(b.agentId),b.pay,b.final])};case 'cancellation':return{c:BC,r:B.filter(b=>['Cancelled','Refunded'].includes(b.status)).map(bk)};case 'gst':return{c:['Invoice','Booking','Taxable','GST '+g+'%','Total'],r:L.map(b=>['INV-'+b.id.slice(-4),b.id,Math.round(b.final/(1+g/100)),Math.round(b.final-b.final/(1+g/100)),b.final])}}}
V.reports=()=>{const d=repData(),A=isAdm()?agentsOnly():db.agents.filter(a=>myIds().includes(a.id));return `<h1>Reports</h1><div class="chips">${Object.entries(REPS).map(([k,l])=>`<span class="chip ${(S.p.r||'sales')==k?'on':''}" onclick="S.p.r='${k}';rep()">${l}</span>`).join('')}</div><div class="card"><div class="row">${inp('rf','From',S.p.f||'','date')}${inp('rt','To',S.p.t||'','date')}${sel('rag','Agent',[['','All'],...A.map(a=>[a.id,a.company])],S.p.ag)}${sel('rpr','Product',[['','All'],'hotel','flight','bus','vehicle','package'],S.p.pr)}<button class="btn" onclick="rep()">Apply</button></div></div><br><div class="card"><div style="margin-bottom:10px"><button class="btn s" onclick="repX(0)">CSV</button> <button class="btn s" onclick="repX(1)">Excel</button> <button class="btn s o" onclick="repP()">Print / PDF</button></div>${table(d.c,d.r.map(r=>r.map(x=>typeof x=='number'&&x>100?fmt(x):esc(x))))}</div>`};
const rep=()=>{S.p.f=val('rf')||S.p.f;S.p.t=val('rt')||S.p.t;S.p.ag=$('rag')?val('rag'):S.p.ag;S.p.pr=$('rpr')?val('rpr'):S.p.pr;render()},repX=x=>{const d=repData();csv('travelsmart24-'+(S.p.r||'sales')+'-report',d.c,d.r,x)},repP=()=>{const d=repData();printDoc((REPS[S.p.r||'sales'])+' Report',table(d.c,d.r.map(r=>r.map(x=>esc(x)))))};

/* support */
V.support=()=>`<h1>Support Center</h1><div class="sub">Dedicated B2B support · ${esc(db.settings.phone)}</div><div class="grid g2"><div class="card"><h3>Create ticket</h3>${sel('t_c','Category',['Booking','Cancellation','Payment','Hotel','Flight','Vehicle','Package','Technical Support'])}<br>${sel('t_p','Priority',['Low','Medium','High'])}<br>${inp('t_s','Subject')}<br><label>Message</label><textarea id="t_m" rows="3"></textarea><br><label>Attachment (name only in demo)</label><input type="file" id="t_f"><br><br><button class="btn" onclick="tkAdd()">Submit</button></div><div class="card"><h3>Tickets</h3>${table(['ID','Subject','Priority','Status',''],db.tickets.filter(t=>myIds().includes(t.agentId)).map(t=>[t.id,esc(t.subj),t.pri,badge(t.status),`<button class="btn s o" onclick="tkView('${t.id}')">Open</button>`]))}</div></div>`;
function tkAdd(){if(!val('t_s'))return toast('Subject required','er');db.tickets.push({id:'TK-'+nextN(db.tickets,/^TK-(\d+)$/,3001),agentId:me().id,cat:val('t_c'),pri:val('t_p'),subj:val('t_s'),status:'Open',msgs:[{from:me().id,t:val('t_m'),d:today(),f:($('t_f').files[0]||{}).name}]});save();toast('Ticket created');render()}
function tkView(id){const t=db.tickets.find(x=>x.id==id);openModal(`<h2>${t.id} · ${esc(t.subj)} ${badge(t.status)}</h2><div class="sub">${t.cat} · ${t.pri}</div>${t.msgs.map(m=>`<div class="card" style="margin-bottom:8px;background:${db.agents.find(a=>a.id==m.from).role.match(/super|admin/)?'var(--gl)':'#fff'}"><b>${esc(agName(m.from))}</b> <small>${m.d}</small><br>${esc(m.t)}${m.f?'<br>📎 '+esc(m.f):''}</div>`).join('')}<textarea id="tk_r" rows="2" placeholder="Reply…"></textarea><br><br><button class="btn" onclick="tkRep('${id}')">Reply</button> <button class="btn o" onclick="tkClose('${id}')">${t.status=='Open'?'Close ticket':'Reopen'}</button> ${isSuper()?`<button class="btn r" onclick="delRec('ticket','${id}')">Delete</button> `:''}<button class="btn d" onclick="closeModal()">Close</button>`)}
const tkRep=id=>{if(!val('tk_r'))return;db.tickets.find(x=>x.id==id).msgs.push({from:me().id,t:val('tk_r'),d:today()});save();tkView(id)},tkClose=id=>{const t=db.tickets.find(x=>x.id==id);t.status=t.status=='Open'?'Closed':'Open';save();closeModal();render()};

/* profile & settings */
V.profile=()=>{const u=me();return `<h1>Profile</h1><div class="card"><h3>${esc(u.company)}</h3>${table(['Field','Value'],[['Agent ID',u.id],['Contact',esc(u.name)],['Mobile',u.mobile],['Email',esc(u.email)],['GST / PAN',esc((u.gst||'-')+' / '+(u.pan||'-'))],['Default markup',u.markup+'%'],['Role',u.role]])}<br><button class="btn o" onclick="agentForm('${u.id}')">Edit</button> <button class="btn d" onclick="logout()">Logout</button></div><br><div class="card"><h3>🔑 Change password</h3><div class="row">${inp('pw_o','Current password','','password')}${inp('pw_n','New password (min 6)','','password')}<button class="btn" onclick="chPw()">Update</button></div></div><br><div class="card"><h3>📱 Install as mobile app</h3>This portal is PWA-ready: open it over HTTPS on your phone → browser menu → “Add to Home Screen”. See README for push notifications & Android/iOS wrappers.</div>`};
V.settings=()=>{const s=db.settings,f=(k,l,t='text')=>inp('s_'+k,l,esc(s[k]),t);return `<h1>Admin Settings</h1><div class="grid g2"><div class="card"><h3>Company</h3><div class="row">${[['company','Company name'],['address','Address'],['phone','Phone'],['email','Email'],['web','Website'],['gstin','GST'],['pan','PAN']].map(x=>f(...x)).join('')}</div></div><div class="card"><h3>Portal</h3><div class="row">${[['portal','Portal name'],['currency','Currency'],['tz','Time zone'],['lang','Language']].map(x=>f(...x)).join('')}</div></div>
 <div class="card"><h3>Booking & Markup</h3><div class="row">${f('cancelRule','Cancellation rules')}${f('defMk','Default markup %','number')}${f('minMk','Min agent markup %','number')}${f('gst','GST %','number')}</div><br><label><input type="checkbox" style="width:auto" id="s_auto" ${s.autoConfirm?'checked':''}> Auto-confirm bookings</label> <label><input type="checkbox" style="width:auto" id="s_appr" ${s.approval?'checked':''}> Agent approval required</label></div>
 <div class="card"><h3>Payments</h3><div class="row">${f('bank','Bank details')}${f('upi','UPI')}${f('gateway','Payment gateway')}</div></div><div class="card"><h3>Notifications & WhatsApp</h3>${['email','sms','wa','push'].map(k=>`<label style="display:inline-block;margin-right:12px"><input type="checkbox" style="width:auto" class="nt" value="${k}" ${s.notif[k]?'checked':''}> ${k}</label>`).join('')}<br><br>${f('waNo','WhatsApp number (deep-links)')}<p class="sub">Official WhatsApp Business API: set <code>WHATSAPP_TOKEN</code> as a server environment variable — never in the browser. This prototype uses wa.me links.</p></div>
 <div class="card"><h3>Supplier API layer</h3>${table(['Product','Provider'],Object.entries(SUPPLIER_CONFIG).map(([k,v])=>[k,v+' (mock)']))}<p class="sub">Replace mock providers in the “SUPPLIER API LAYER” section of this file with real adapters; keep keys on the server.</p></div></div><br><button class="btn" onclick="setSave()">Save settings</button> ${isSuper()?`<button class="btn r" onclick="deleteDemo()">🗑 Delete all demo data</button> <button class="btn o" onclick="restoreDemo()">Restore sample demo data</button> <span class="sub">${demoCount()} demo records currently loaded</span>`:''}
 ${isSuper()?`<div class="card" style="margin-top:14px"><h3>🔒 File access password</h3><div class="row">${inp('g_cu','Current username')}${inp('g_cp','Current password','','password')}${inp('g_nu','New username')}${inp('g_np','New password (min 6)','','password')}<button class="btn" onclick="chGate()">Update</button></div><p class="sub">Controls who can open this file in this browser. Use a long password. For real protection also password-protect your web hosting.</p></div>`:''}<div class="card" style="margin-top:14px"><h3>Audit log</h3>${table(['Time','User','Action'],db.audit.slice(0,15).map(a=>[a.t,a.u,esc(a.a)]))}</div>`};
function setSave(){const s=db.settings;Object.keys(s).forEach(k=>{if($('s_'+k))s[k]=['defMk','minMk','gst'].includes(k)?+val('s_'+k):val('s_'+k)});s.autoConfirm=$('s_auto').checked;s.approval=$('s_appr').checked;document.querySelectorAll('.nt').forEach(c=>s.notif[c.value]=c.checked);audit('Settings saved');save();toast('Settings saved')}

/* ---------- boot ---------- */
try{const m={name:'Travelsmart24 B2B',short_name:'TS24 B2B',start_url:'.',display:'standalone',background_color:'#ffffff',theme_color:'#A3C400'};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}
function boot(){load();if(sess&&me()&&me().status==='Active')S.page='app';else{sess=null;if(S.page==='app')S.page='landing'}render()}
let gateOk=false;try{gateOk=sessionStorage.getItem('ts24_gate_ok')===gateHash()}catch(e){}
gateOk?boot():gateUI();
</script></body></html>
